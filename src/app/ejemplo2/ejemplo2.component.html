<div class="d-flex justify-content-center">

    <div class="w-25">
        <div class="display-3">
            Sign up
        </div>
        <div>
            <form [autocomplete]="false">
                <div>
                    <div class="h4">
                        Bienvenido a VMT Dev
                    </div>
                </div>
                <div>
                    <!--Aqui no es obligatorio usar el name porque no vamos a usar JS para manejar sus valores, ni el metodo POST ni el metodo submit para enviar los valores de un lugar a otro. -->
                    <label for="nombre">Nombre:</label>
                    <input class="form-control" [(ngModel)]="signupobjetct.firstname" type="text" name="nombre" id="nombre" placeholder="Ingrese tu nombre" required>
                </div>
                <div>
                    <label for="apellido">Apellido:</label>
                    <input class="form-control" [(ngModel)]="signupobjetct.lastname" type="text" name="apellido" id="apellido" placeholder="Ingrese su apellido" required>
                </div>
                <div>
                    <label for="birthdate">Fecha de nacimiento:</label>
                    <input class="form-control" [(ngModel)]="signupobjetct.birthdate" type="date" name="birthdate" id="birthdate" placeholder="Ingrese tu fecha de nacimiento" required>
                </div>
                <div>
                    <label for="correo">Correo:</label>
                    <input class="form-control" [(ngModel)]="signupobjetct.firstname" type="email" name="correo" id="correo" placeholder="Ingrese tu correo" required>
                </div>
                <div>
                    <label for="phonenumber">Número de teléfono:</label>
                    <input class="form-control" [(ngModel)]="signupobjetct.phonenumber" type="tel" name="phonenumber" id="phonenumber" placeholder="Ingrese tu teléfono" required>
                </div>
                <div>
                    <label for="password">Contraseña:</label>
                    <input type="password" name="password" id="password" class="form-control" [(ngModel)]="firstInputPassword" [placeholder]="'Ingresa tu contraseña'" required>
                    <!--Si se quiere poner dentro del atributo html de placeholder ahi mismo el texto a mostrar se poner comillas simples dentro de las comillas dobles "''"-->
                </div>
                <div>
                    <label for="conf-password">Contraseña:</label>
                    <input type="password" name="conf-password" id="conf-password" class="form-control" [(ngModel)]="confirmInputPassword" [placeholder]="'Confirma tu contraseña'" required>
                    <!--Si se quiere poner dentro del atributo html de placeholder ahi mismo el texto a mostrar se poner comillas simples dentro de las comillas dobles "''"-->
                </div>
                <div>
                    <button class="btn btn-success mt-3 w-100">Iniciar sesión</button>
                </div>
                
            </form>
        </div>

    </div>

</div>
